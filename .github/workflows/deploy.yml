name: Auto Deploy Next.js to Windows Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build and restart Docker container
        shell: powershell
        run: |
          $env:PATH += ";C:\Users\SultanKingGD\AppData\Local\Programs\DockerDesktop\resources\bin"
          docker compose build --no-cache
          docker compose up -d --force-recreate
          docker image prune -f

services:
  nextjs-web:
    container_name: nextjs-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - C:/flower-shop-config/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"