name: Auto Deploy Next.js to Windows Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build and restart Docker container
        shell: powershell
        run: |
          $env:PATH += ";C:\Program Files\Docker\Docker\resources\bin;C:\Program Files\Docker;C:\ProgramData\DockerDesktop\version-bin"
          docker compose up -d --build --remove-orphans
          docker image prune -f