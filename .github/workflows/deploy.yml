name: Auto Deploy Next.js to Windows Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build and restart Docker container
        shell: powershell
        run: |
          $env:PATH += ";C:\Users\SultanKingGD\AppData\Local\Programs\DockerDesktop\resources\bin"
          docker compose up -d --build --remove-orphans
          docker image prune -f